<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://davidhalmi.com/">
<title>Redirecting to davidhalmi.com</title>
<script>
(function(){
  var target = new URL(window.location.href);
  target.protocol = "https:";
  target.hostname = "davidhalmi.com";
  target.port = "";
  window.location.replace(target.toString());
})();
</script>
<meta http-equiv="refresh" content="0;url=https://davidhalmi.com/">
</head>

<p>Redirecting to <a href="https://davidhalmi.com/">davidhalmi.com</a>…</p>
</body>
